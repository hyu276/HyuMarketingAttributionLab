name: Domain tests and documentation integrity
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  domain-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Standalone TypeScript domain tests
        run: node --experimental-strip-types --test tests/unit/*.test.ts
      - name: Repository rules integrity
        run: python3 scripts/check_repository_rules.py
